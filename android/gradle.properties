# file.encoding は MS932 にしてある。UTF-8 に戻さないこと。
# リポジトリのパスに日本語（卒研）が含まれるため、UTF-8 だと Gradle のテストワーカーが
# クラスパスを解決できず、testDebugUnitTest が ClassNotFoundException で失敗する。
# 2026-09-03 に実測して確認した。Test タスク側の defaultCharacterEncoding だけでは効かない。
# リポジトリを ASCII だけのパスへ移せば、この設定は不要になる。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=MS932
android.useAndroidX=true
kotlin.code.style=official

# 同じくパスの日本語対策。AGP がパスの非ASCII文字をエラー扱いにするのを抑止する。
android.overridePathCheck=true
